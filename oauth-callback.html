<!-- oauth-callback.html — Google sends the reader back here after "Sign in with Google & sync" (vv-sync.js, 2026-11-06). It only
     hands Google's one-time code to the site tab through this origin's localStorage (key vvsync:code — works even when Google's

<p id="m">Signing in…</p>
<script>
